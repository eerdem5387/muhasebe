services:
  db:
    image: postgres:16-alpine
    container_name: muhasebe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: muhasebe
      POSTGRES_PASSWORD: muhasebe
      POSTGRES_DB: muhasebe
    ports:
      - "5432:5432"
    volumes:
      - muhasebe_pgdata:/var/lib/postgresql/data

volumes:
  muhasebe_pgdata:
